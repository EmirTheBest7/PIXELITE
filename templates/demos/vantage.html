<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Vantage — Stop Digging Through Dashboards</title>
    <meta name="description" content="Your metrics are scattered across a dozen dashboards. Vantage bring them into one clear signal, so every decision is backed by data you actually trust." />
    <meta property="og:title" content="Stop Digging Through Dashboards" />
    <meta property="og:description" content="Your metrics are scattered across a dozen dashboards. Vantage bring them into one clear signal, so every decision is backed by data you actually trust." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <script src="/assets/templates/vantage/vantage-head.js"></script>
    <meta name="robots" content="noindex,nofollow">
    <link rel="stylesheet" href="/assets/templates/vantage/vantage.css">
  </head>
  <body>
    <main class="viewport">
      <section class="screen" id="screen">
        <video
          class="background"
          autoplay
          muted
          loop
          playsinline
          disablepictureinpicture
          aria-hidden="true"
        >
          <source
            src="/assets/templates/vantage/video/background.mp4"
            type="video/mp4"
          >
        </video>

        <header class="header">
          <a class="brand" href="#" aria-label="Vantage home">
            <svg width="25" height="25" viewBox="0 0 25 25" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <defs>
                <clipPath id="brand-clip">
                  <circle cx="12.5" cy="12.5" r="12.5" />
                </clipPath>
              </defs>
              <g clip-path="url(#brand-clip)">
                <rect width="25" height="25" fill="#ededed" />
                <polygon points="12.5,0 25,6 18,14 12.5,9" fill="#050606" />
                <polygon points="0,5 12.5,0 12.5,9 5,13" fill="#737778" />
                <polygon points="5,13 12.5,9 15,19 7,22" fill="#fafafa" />
                <polygon points="12.5,9 18,14 25,18 15,19" fill="#0a0b0b" />
                <polygon points="7,22 15,19 25,25 0,25" fill="#050606" />
                <polygon points="0,5 5,13 0,19" fill="#737778" />
              </g>
            </svg>
          </a>

          <div class="header-actions" id="tablet-navigation">
            <nav class="nav">
              <a href="#home" class="active">Home</a>
              <a href="#about">About</a>
              <a href="#services">Services</a>
              <a href="#contact">Contact</a>
            </nav>

            <div class="time-panel">
              <span class="time-label">Timezone</span>
              <span class="time-value">9:47 PM&nbsp; • &nbsp;14 July 2026</span>
            </div>

            <button type="button" class="sign-up">Sign Up</button>
          </div>

          <button
            type="button"
            class="menu-toggle"
            aria-label="Toggle menu"
            aria-expanded="false"
            aria-controls="tablet-navigation"
          >
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <line class="menu-bar menu-bar-top" x1="3" y1="6" x2="17" y2="6" />
              <line class="menu-bar menu-bar-bottom" x1="3" y1="14" x2="17" y2="14" />
            </svg>
          </button>
        </header>

        <section class="hero">
          <div class="hero-content">
            <h1 class="hero-title">
              <span class="line line-one">
                <span class="line-reveal">Stop Digging</span>
              </span>
              <span class="line line-two">
                <span class="line-reveal">Through Dashboards.</span>
              </span>
            </h1>

            <p class="hero-copy">
              Your metrics are scattered across a dozen dashboards.<br>
              Vantage bring them into one clear signal, so every<br>
              decision is backed by data you actually trust.
            </p>

            <button type="button" class="primary-cta">
              <span class="label">Get Started</span>
              <span class="arrow-box">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M5 12h14"></path>
                  <path d="m12 5 7 7-7 7"></path>
                </svg>
              </span>
            </button>
          </div>

          <article class="demo-card">
            <div class="demo-visual">
              <img
                src="/assets/templates/vantage/img/watch-demo-thumbnail.jpg"
                alt="Abstract red and blue smoke"
              >
              <button type="button" class="play" aria-label="Play demo">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true">
                  <polygon points="6,3 20,12 6,21"></polygon>
                </svg>
              </button>
            </div>
            <button type="button" class="watch-button">Watch Demo</button>
          </article>
        </section>
      </section>
    </main>

    <script src="/assets/templates/vantage/vantage.js"></script>
  </body>
</html>
