name: Provision bot config on Endora (FTP)

# Server-side configuration for the Telegram bots that deploy themselves next to the site (docs/bots/README.md).
# The bots' CODE is uploaded by their own repositories; this workflow only places what must never be in a repository:
#   secret BOT_LASH_ENV (the bot's whole production .env)  ->  FTP ./bots/lash/.env
#   its BASE_URL                                           ->  FTP ./storage/bot-urls.ini  (read by /admin/bots)
# The repository is public: values come only from GitHub secrets, are never echoed, and never enter an artifact.
# The upload is two single-file FTP PUTs, so it can only ever replace those two files; it never deletes anything and
# never touches the bot's code, its database or anything of the site. Changing the secret does nothing until this workflow
# runs again: Actions -> "Provision bot config" -> Run workflow (or a push that changes this file / config/bots.php).
# Live only when the repository variable DEPLOY_ENABLED is "true" (same switch as the site deploy).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/provision-bots.yml
      - config/bots.php
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the planned changes, upload nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provision-bots
  cancel-in-progress: false

jobs:
  lash:
    name: Bot lash (.env + monitor URL)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LIVE: ${{ vars.DEPLOY_ENABLED == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          coverage: none

      # Validates the secret and writes the two files. Refuses (fails the run) instead of uploading a broken .env:
      # a bot with an empty token or a wrong BASE_URL would be live but deaf. Prints only key names, never values.
      - name: Build and validate the files from the secret
        id: build
        env:
          BOT_ENV: ${{ secrets.BOT_LASH_ENV }}
        run: |
          if [ -z "$BOT_ENV" ]; then
            echo "::notice::secret BOT_LASH_ENV is not set - nothing to provision"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .provision/lash .provision/urls
          php -r '
            $raw = (string) getenv("BOT_ENV");
            $v = [];
            foreach (preg_split("/\r?\n/", $raw) as $l) {
                if (preg_match("/^\s*([A-Z][A-Z0-9_]*)\s*=(.*)$/", $l, $m)) { $v[$m[1]] = trim(trim($m[2]), "\"\x27"); }
            }
            $fail = [];
            foreach (["APP_ENV", "BASE_URL", "BOT_TOKEN", "WEBHOOK_SECRET", "TICK_SECRET"] as $k) {
                if (($v[$k] ?? "") === "") { $fail[] = "$k is empty"; }
            }
            if (($v["BOT_TOKEN"] ?? "") !== "" && !preg_match("/^\d{5,15}:[A-Za-z0-9_-]{30,}$/", $v["BOT_TOKEN"])) { $fail[] = "BOT_TOKEN does not look like a Bot API token"; }
            if (!preg_match("#^https://pixelite\.cz/tg/([A-Za-z0-9_-]{16,64})/?$#", $v["BASE_URL"] ?? "", $bm)) { $fail[] = "BASE_URL must be https://pixelite.cz/tg/<16-64 chars A-Za-z0-9_->"; }
            foreach (["DB_PATH", "LOG_DIR"] as $k) { if (isset($v[$k])) { $fail[] = "$k must not be set (the bot keeps its data in ./bots/lash/storage/)"; } }
            if (isset($v["TELEGRAM_API_BASE"]) && $v["TELEGRAM_API_BASE"] !== "https://api.telegram.org") { $fail[] = "TELEGRAM_API_BASE must be https://api.telegram.org or absent"; }
            if ($fail) { foreach ($fail as $f) { echo "::error::BOT_LASH_ENV: $f\n"; } exit(1); }
            echo "::add-mask::" . $bm[1] . "\n";
            file_put_contents(".provision/lash/.env", rtrim($raw) . "\n");
            file_put_contents(".provision/urls/bot-urls.ini", "BOT_LASH_URL = \"" . rtrim($v["BASE_URL"], "/") . "\"\n");
            echo "BOT_LASH_ENV ok: " . implode(", ", array_keys($v)) . "\n";
          '
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Mode
        if: steps.build.outputs.configured == 'true'
        run: |
          if [ "$LIVE" = "true" ]; then echo "::notice::LIVE provisioning"; else echo "::notice::DRY RUN - nothing is uploaded"; fi

      # Two single-file PUTs with lftp (not FTP-Deploy-Action): a put can only write the named file, never delete, and
      # lftp prints the server's own reply. FTP-Deploy-Action died here with "ECONNRESET (data socket)" (run 43967603304,
      # twice): on a first publish it downloads the missing state file, which over FTPS on Endora leaves its data socket
      # reset (same failure in TG-PHPBot run 44060207117). The .env goes up under a temporary name and is renamed in place,
      # so the bot never reads a half-written file.
      # Remote paths are literals on purpose: bots/lash/.env and storage/bot-urls.ini only.
      - name: Install lftp
        if: steps.build.outputs.configured == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: FTP - bot .env and monitor URL
        if: steps.build.outputs.configured == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_SECURITY: ${{ vars.FTP_SECURITY || 'strict' }}
        run: |
          set +x
          host="${FTP_SERVER#ftp://}"; host="${host#ftps://}"; host="${host%%/*}"
          if [ "$FTP_PROTOCOL" = "ftps" ]; then
            tls="set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate $([ "$FTP_SECURITY" = loose ] && echo no || echo yes);"
          else
            tls="set ftp:ssl-allow no;"
          fi
          ftp() { lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "ftp://$host" -e "$tls set net:max-retries 2; set net:timeout 30; set cmd:fail-exit yes; $1; bye" 2>&1; }
          if [ "$LIVE" != "true" ]; then
            echo "DRY RUN: would upload bots/lash/.env and storage/bot-urls.ini"
            ftp "cls -1 -d bots/lash storage" || true
            exit 0
          fi
          tmp=".env.upload-$(openssl rand -hex 6)"
          ftp "mkdir -p -f bots/lash; put .provision/lash/.env -o bots/lash/$tmp; mv bots/lash/$tmp bots/lash/.env; put .provision/urls/bot-urls.ini -o storage/bot-urls.ini" \
            || { echo "::error::upload failed"; ftp "rm -f bots/lash/$tmp" || true; exit 1; }
          echo "--- placed (names and sizes) ---"
          ftp "cls -1 -a -s bots/lash/.env storage/bot-urls.ini"

      - name: Remove the files from the runner
        if: always()
        run: rm -rf .provision
